<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopSphere</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #fff;
            --ink: #14161c;
            --muted: #6b7280;
            --line: #e5e7eb;
            --brand: #5b4bff;
            --brand-ink: #fff;
            --good: #0a8a4a;
            --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 6px 20px rgba(20, 22, 28, .06)
        }

        @media (prefers-color-scheme:dark) {
            :root {
                --bg: #0f1115;
                --card: #171a21;
                --ink: #eef0f4;
                --muted: #9aa3b2;
                --line: #262b36;
                --brand: #8b7dff;
                --brand-ink: #0f1115;
                --good: #3ad17f;
                --shadow: 0 1px 2px rgba(0, 0, 0, .5)
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding: 12px 16px
        }

        .top-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            max-width: 1280px;
            margin: 0 auto
        }

        .logo {
            font-size: 20px;
            margin: 0;
            white-space: nowrap
        }

        .search {
            flex: 1;
            min-width: 180px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--bg);
            color: var(--ink);
            font: inherit
        }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            background: var(--brand);
            color: var(--brand-ink);
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }

        .btn.ghost {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line)
        }

        .btn:hover {
            filter: brightness(1.06)
        }

        .pill {
            background: var(--brand-ink);
            color: var(--brand);
            border-radius: 99px;
            padding: 0 8px;
            margin-left: 4px;
            font-size: 12px
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0 4px;
            max-width: 1280px;
            margin: 0 auto
        }

        .chip {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            border-radius: 99px;
            padding: 6px 14px;
            cursor: pointer;
            white-space: nowrap;
            font: inherit
        }

        .chip.on {
            background: var(--brand);
            color: var(--brand-ink);
            border-color: var(--brand)
        }

        .toolbar {
            display: flex;
            gap: 14px;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            max-width: 1280px;
            margin: 6px auto 0;
            font-size: 13px
        }

        .toolbar .muted {
            margin-right: auto
        }

        .toolbar select {
            margin-left: 6px;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--ink)
        }

        .muted {
            color: var(--muted)
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform .12s
        }

        .card:hover {
            transform: translateY(-2px)
        }

        .thumb {
            position: relative;
            aspect-ratio: 1/1;
            background: linear-gradient(135deg, rgba(91, 75, 255, .10), rgba(91, 75, 255, .02));
            display: grid;
            place-items: center;
            overflow: hidden
        }

        .thumb .emoji {
            font-size: 64px
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--good);
            color: #fff;
            border-radius: 6px;
            padding: 2px 7px;
            font-size: 12px;
            font-weight: 700
        }

        .badge.mine {
            left: auto;
            right: 8px;
            background: var(--brand);
            color: var(--brand-ink)
        }

        .info {
            padding: 10px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1
        }

        .brand {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .04em
        }

        .info h3 {
            font-size: 14px;
            margin: 0;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.8em
        }

        .rate {
            font-size: 13px;
            color: var(--good)
        }

        .rate span {
            color: var(--muted)
        }

        .price {
            font-weight: 700;
            font-size: 16px
        }

        .price s {
            font-weight: 400;
            font-size: 13px;
            color: var(--muted);
            margin-left: 4px
        }

        .info .btn {
            margin-top: auto;
            padding: 8px 10px;
            font-size: 14px
        }

        .more {
            text-align: center;
            padding: 20px
        }

        .empty {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 0;
            color: var(--muted)
        }

        .modal {
            border: 0;
            border-radius: 16px;
            padding: 0;
            max-width: 760px;
            width: calc(100% - 24px);
            background: var(--card);
            color: var(--ink);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35)
        }

        .modal::backdrop {
            background: rgba(0, 0, 0, .5)
        }

        .detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            padding: 20px
        }

        @media(max-width:640px) {
            .detail {
                grid-template-columns: 1fr
            }
        }

        .detail .thumb {
            border-radius: 12px
        }

        .detail .thumb .emoji {
            font-size: 110px
        }

        .detail h2 {
            margin: 4px 0 6px;
            font-size: 20px
        }

        .detail .price {
            font-size: 22px;
            margin: 8px 0
        }

        .detail table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
            margin-top: 10px
        }

        .detail td {
            padding: 5px 0;
            border-bottom: 1px solid var(--line);
            vertical-align: top
        }

        .detail td:first-child {
            color: var(--muted);
            width: 42%
        }

        .upload {
            margin-top: 10px;
            padding: 10px;
            border: 1px dashed var(--line);
            border-radius: 10px;
            font-size: 13px
        }

        .upload input {
            display: block;
            margin-top: 6px;
            max-width: 100%
        }

        .row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap
        }

        .x {
            border: 0;
            background: transparent;
            color: var(--ink);
            font-size: 18px;
            cursor: pointer
        }

        .form {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .form h2 {
            margin: 0
        }

        .form label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            color: var(--muted)
        }

        .form input,
        .form select,
        .form textarea {
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg);
            color: var(--ink);
            font: inherit
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px
        }

        .preview img {
            max-width: 140px;
            border-radius: 10px
        }

        .cart {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: min(380px, 100%);
            background: var(--card);
            box-shadow: -10px 0 40px rgba(0, 0, 0, .25);
            transform: translateX(105%);
            transition: transform .22s;
            z-index: 40;
            display: flex;
            flex-direction: column
        }

        .cart.open {
            transform: none
        }

        .cart-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line)
        }

        .cart-head h2 {
            margin: 0;
            font-size: 18px
        }

        .cart-items {
            flex: 1;
            overflow: auto;
            padding: 8px 16px
        }

        .ci {
            display: grid;
            grid-template-columns: 52px 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--line)
        }

        .ci .t {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            background: var(--bg);
            display: grid;
            place-items: center;
            font-size: 28px;
            overflow: hidden
        }

        .ci .t img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .ci .n {
            font-size: 13px;
            font-weight: 600
        }

        .qty {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px
        }

        .qty button {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            cursor: pointer
        }

        .cart-foot {
            padding: 14px 16px;
            border-top: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 18px
        }

        .scrim {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            z-index: 30
        }

        .scrim.on {
            opacity: 1;
            pointer-events: auto
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 20px);
            background: var(--ink);
            color: var(--bg);
            padding: 10px 16px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: .2s;
            z-index: 60
        }

        .toast.on {
            opacity: 1;
            transform: translate(-50%, 0)
        }
    </style>
</head>

<body>
    <header class="top">
        <div class="top-row">
            <h1 class="logo">🛍️ ShopSphere</h1>
            <input id="q" class="search" type="search" placeholder="Search 2000+ products, brands, phones…"
                autocomplete="off">
            <button id="openAdd" class="btn ghost" type="button">＋ Add product</button>
            <button id="openCart" class="btn" type="button">🛒 Cart <span id="cartCount" class="pill">0</span></button>
        </div>
        <nav id="chips" class="chips" aria-label="Categories"></nav>
        <div class="toolbar">
            <span id="count" class="muted"></span>
            <label>Price
                <select id="price">
                    <option value="0-Infinity">Any</option>
                    <option value="0-500">Under ₹500</option>
                    <option value="500-2000">₹500 – ₹2,000</option>
                    <option value="2000-10000">₹2,000 – ₹10,000</option>
                    <option value="10000-50000">₹10,000 – ₹50,000</option>
                    <option value="50000-Infinity">Above ₹50,000</option>
                </select>
            </label>
            <label>Sort
                <select id="sort">
                    <option value="featured">Featured</option>
                    <option value="low">Price: Low to High</option>
                    <option value="high">Price: High to Low</option>
                    <option value="rating">Top rated</option>
                    <option value="discount">Biggest discount</option>
                </select>
            </label>
        </div>
    </header>

    <main>
        <section id="grid" class="grid"></section>
        <div class="more"><button id="more" class="btn ghost" type="button">Load more</button></div>
    </main>

    <dialog id="detail" class="modal"></dialog>

    <dialog id="addDlg" class="modal">
        <form id="addForm" method="dialog" class="form">
            <h2>Add your own product</h2>
            <label>Title *<input name="title" required maxlength="120"></label>
            <label>Brand<input name="brand" maxlength="60" placeholder="Optional"></label>
            <label>Category *
                <select name="category" required id="addCat"></select>
            </label>
            <div class="two">
                <label>Price (₹) *<input name="price" type="number" min="1" step="1" required></label>
                <label>Old price (₹)<input name="oldPrice" type="number" min="1" step="1"></label>
            </div>
            <label>Description<textarea name="description" rows="3" maxlength="500"></textarea></label>
            <label>Your image <small>(optional)</small><input name="image" type="file" accept="image/*"></label>
            <div id="addPreview" class="preview"></div>
            <div class="actions">
                <button type="button" class="btn ghost" id="addCancel">Cancel</button>
                <button type="submit" class="btn">Save product</button>
            </div>
        </form>
    </dialog>

    <aside id="cart" class="cart" aria-label="Cart">
        <div class="cart-head">
            <h2>Your cart</h2><button id="closeCart" class="x" aria-label="Close cart">✕</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-foot">
            <div class="total"><span>Total</span><strong id="cartTotal">₹0</strong></div>
            <button id="clearCart" class="btn ghost" type="button">Clear cart</button>
            <button id="checkout" class="btn" type="button">Checkout (demo)</button>
        </div>
    </aside>
    <div id="scrim" class="scrim"></div>
    <div id="toast" class="toast" role="status"></div>

    <script>

        const categories = ['All', 'Mobiles', 'Electronics', 'Food', 'Fashion', 'Beauty', 'Home', 'Others'];

        const seed = [

        ];

        function buildCatalog() {
            function rng(s) { return function () { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            const rand = rng(20261011);
            const pick = (a) => a[Math.floor(rand() * a.length)];
            const sample = (a, n) => { const c = [...a], o = []; while (o.length < n && c.length) o.push(c.splice(Math.floor(rand() * c.length), 1)[0]); return o; };
            const tidy = (p) => p < 100 ? Math.max(9, Math.round(p / 5) * 5 - 1) : p < 1000 ? Math.round(p / 10) * 10 - 1 : p < 10000 ? Math.round(p / 50) * 50 - 1 : Math.round(p / 500) * 500 - 1;

            const out = [];
            let n = 0;
            function add(o) {
                const price = tidy(o.price);
                let old = tidy(price * (1.08 + rand() * 0.35));
                if (old <= price) old = tidy(price * 1.2) + 1;
                out.push({
                    id: 'g' + (++n), title: o.title, brand: o.brand, category: o.category,
                    price, oldPrice: old, rating: +(3.6 + rand() * 1.3).toFixed(1),
                    reviews: Math.floor(20 + rand() * rand() * 9000),
                    emoji: o.emoji, description: o.description, specs: o.specs,
                });
            }

            function fromTypes(category, brands, types, opts = {}) {
                const series = ['Lite', 'Pro', 'Plus', 'Air', 'Max', 'One', 'Neo', 'S', 'X', 'Prime'];
                for (const [name, emoji, lo, hi, desc, specs, variants, vk] of types) {
                    for (const brand of brands) {
                        const base = lo + (hi - lo) * Math.pow(rand(), 1.4);
                        const chosen = sample(variants, Math.min(variants.length, opts.perVariant || 2));
                        for (const [label, mult] of chosen) {
                            const spec = { Brand: brand };
                            for (const k in specs) spec[k] = pick(specs[k]);
                            if (vk && label) spec[vk] = label;
                            const model = opts.model ? ' ' + pick(series) : '';
                            add({
                                title: `${brand}${model} ${name}${label ? ' (' + label + ')' : ''}`,
                                brand, category, emoji, price: base * mult, description: desc, specs: spec,
                            });
                        }
                    }
                }
            }

            const SIZES_CLOTH = [['S', 1], ['M', 1], ['L', 1], ['XL', 1.03], ['XXL', 1.06]];

            function fileToDataURL(file, max = 640) {
                return new Promise((resolve, reject) => {
                    const fr = new FileReader();
                    fr.onerror = reject;
                    fr.onload = () => {
                        const img = new Image();
                        img.onerror = reject;
                        img.onload = () => {
                            const s = Math.min(1, max / Math.max(img.width, img.height));
                            const c = document.createElement('canvas');
                            c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
                            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                            resolve(c.toDataURL('image/jpeg', 0.82));
                        };
                        img.src = fr.result;
                    };
                    fr.readAsDataURL(file);
                });

      <div><div class="n">${esc(p.title)}</div><div class="muted">₹${fmt(p.price)}</div>
        <div class="qty"><button data-action="dec" data-id="${esc(id)}" type="button">−</button><span>${q}</span><button data-action="inc" data-id="${esc(id)}" type="button">+</button></div></div>
      <strong>₹${fmt(p.price * q)}</strong></div>`;
                }).join('');
                $('#cartItems').innerHTML = rows || '<p class="muted">Your cart is empty.</p>';
                const { count, total } = cartTotals();
                $('#cartCount').textContent = count;
                $('#cartTotal').textContent = '₹' + fmt(total);
            }
            function setCart(id, qty) { if (qty <= 0) delete cart[id]; else cart[id] = qty; save(KEY_CART, cart); renderCart(); }
            function toggleCart(open) { $('#cart').classList.toggle('open', open); $('#scrim').classList.toggle('on', open); }

            document.addEventListener('click', (e) => {
                const chip = e.target.closest('[data-cat]');
                if (chip) { state.cat = chip.dataset.cat; state.shown = PAGE; renderChips(); renderGrid(); return; }
                const el = e.target.closest('[data-action]');
                if (!el) return;
                const { action, id } = el.dataset;
                if (action === 'add') { setCart(id, (cart[id] || 0) + 1); toast('Added to cart'); }
                else if (action === 'open') openDetail(id);
                else if (action === 'inc') setCart(id, (cart[id] || 0) + 1);
                else if (action === 'dec') setCart(id, (cart[id] || 0) - 1);
                else if (action === 'close') $('#detail').close();
                else if (action === 'rmimg') { delete images[id]; save(KEY_IMAGES, images); renderGrid(); renderCart(); openDetail(id); }
                else if (action === 'delete') {
                    if (!confirm('Delete this product?')) return;
                    custom = custom.filter((p) => p.id !== id); delete images[id]; delete cart[id];
                    save(KEY_CUSTOM, custom); save(KEY_IMAGES, images); save(KEY_CART, cart);
                    $('#detail').close(); renderGrid(); renderCart();
                }
            });

            document.addEventListener('change', async (e) => {
                const inp = e.target.closest('[data-upload]');
                if (!inp || !inp.files[0]) return;
                try {
                    images[inp.dataset.upload] = await fileToDataURL(inp.files[0]);
                    if (save(KEY_IMAGES, images)) { toast('Image saved'); renderGrid(); renderCart(); openDetail(inp.dataset.upload); }
                } catch { toast('Could not read that image.'); }
            });

            $('#detail').addEventListener('click', (e) => { if (e.target === $('#detail')) $('#detail').close(); });
            $('#q').addEventListener('input', (e) => { state.q = e.target.value; state.shown = PAGE; renderGrid(); });
            $('#sort').addEventListener('change', (e) => { state.sort = e.target.value; state.shown = PAGE; renderGrid(); });
            $('#price').addEventListener('change', (e) => { const [a, b] = e.target.value.split('-').map(Number); state.min = a; state.max = b; state.shown = PAGE; renderGrid(); });
            $('#more').addEventListener('click', () => { state.shown += PAGE; renderGrid(); });
            $('#openCart').addEventListener('click', () => toggleCart(true));
            $('#closeCart').addEventListener('click', () => toggleCart(false));
            $('#scrim').addEventListener('click', () => toggleCart(false));
            $('#clearCart').addEventListener('click', () => { cart = {}; save(KEY_CART, cart); renderCart(); });
            $('#checkout').addEventListener('click', () => toast('Demo only — connect a payment gateway to take real orders.'));

            $('#addCat').innerHTML = categories.filter((c) => c !== 'All').map((c) => `<option>${esc(c)}</option>`).join('');
            $('#openAdd').addEventListener('click', () => { $('#addForm').reset(); $('#addPreview').innerHTML = ''; $('#addDlg').showModal(); });
            $('#addCancel').addEventListener('click', () => $('#addDlg').close());
            $('#addForm').elements.image.addEventListener('change', async (e) => {
                const f = e.target.files[0];
                $('#addPreview').innerHTML = f ? `<img src="${await fileToDataURL(f, 300)}" alt="preview">` : '';
            });
            $('#addForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const f = e.target.elements;
                const price = Math.round(Number(f.price.value));
                const old = Math.round(Number(f.oldPrice.value)) || 0;
                const id = 'c' + Date.now();
                const emojiByCat = { Mobiles: '📱', Electronics: '🔌', Food: '🍽️', Fashion: '👕', Beauty: '💄', Home: '🏠', Others: '📦' };
                const p = { id, title: f.title.value.trim(), brand: f.brand.value.trim(), category: f.category.value, price, oldPrice: old > price ? old : 0, rating: 0, reviews: 0, emoji: emojiByCat[f.category.value] || '📦', description: f.description.value.trim(), specs: { Added: 'By you' } };
                if (f.image.files[0]) {
                    try { images[id] = await fileToDataURL(f.image.files[0]); } catch { toast('Image could not be read; saved without it.'); }
                }
                custom.unshift(p);
                if (save(KEY_CUSTOM, custom)) { save(KEY_IMAGES, images); $('#addDlg').close(); state.cat = 'All'; state.shown = PAGE; renderChips(); renderGrid(); toast('Product added'); }
                else { custom.shift(); delete images[id]; }
            });

            renderChips(); renderGrid(); renderCart();

        })();
    </script>
</body>

</html>
